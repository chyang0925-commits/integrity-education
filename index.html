<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 하반기 청렴교육 출석</title>
<meta name="description" content="2026 하반기 청렴교육 출석 확인 및 만족도 설문">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg1: #0b1430;
    --bg2: #1b2a5a;
    --gold: #f3d48a;
    --mint: #8fd5c9;
    --text: #f4f6fb;
    --muted: #b9c2dc;
    --card: rgba(255, 255, 255, 0.07);
    --line: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: radial-gradient(120% 80% at 50% 0%, var(--bg2) 0%, var(--bg1) 60%, #070d20 100%);
    background-color: var(--bg1);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  .wrap {
    position: relative; z-index: 1;
    min-height: 100%;
    max-width: 440px; margin: 0 auto;
    padding: max(48px, env(safe-area-inset-top)) 22px max(36px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; justify-content: center; gap: 22px;
  }

  /* 순차 등장 */
  .rise { opacity: 0; transform: translateY(18px); animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .badge {
    align-self: flex-start;
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.2px;
    color: var(--gold);
    border: 1px solid rgba(243, 212, 138, 0.45);
    background: rgba(243, 212, 138, 0.08);
    padding: 6px 12px; border-radius: 999px;
    animation-delay: 0.3s;
  }
  .title { font-size: 31px; line-height: 1.32; font-weight: 800; letter-spacing: -0.6px; }
  .title .l1 { display: block; animation-delay: 0.7s; }
  .title .l2 { display: block; animation-delay: 1.0s; }
  .title em {
    font-style: normal;
    background: linear-gradient(90deg, var(--gold), #ffe9b8 50%, var(--mint));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { font-size: 15px; line-height: 1.65; color: var(--muted); animation-delay: 1.3s; word-break: keep-all; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 18px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    animation-delay: 1.6s;
  }
  .row { display: grid; grid-template-columns: 54px 1fr; gap: 8px; padding: 7px 0; font-size: 14.5px; line-height: 1.5; }
  .row + .row { border-top: 1px dashed var(--line); }
  .row dt { color: var(--muted); font-weight: 600; }
  .row dd { font-weight: 600; word-break: keep-all; }
  .nw { white-space: nowrap; }

  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; animation-delay: 1.9s; }
  .step {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.45; color: var(--muted);
  }
  .step b { display: block; color: var(--text); font-size: 15px; margin-top: 4px; }
  .step .n {
    display: inline-flex; width: 22px; height: 22px; border-radius: 50%;
    align-items: center; justify-content: center; font-size: 12px; font-weight: 800;
    background: var(--gold); color: #1b2238;
  }

  .cta { animation-delay: 2.3s; display: flex; flex-direction: column; gap: 10px; }
  .btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 56px; border: 0; border-radius: 16px; cursor: pointer;
    font-family: inherit; font-size: 17px; font-weight: 800; color: #1b2238;
    background: linear-gradient(135deg, #ffe7a8, var(--gold) 55%, #e9bf62);
    box-shadow: 0 10px 30px rgba(243, 212, 138, 0.25);
    text-decoration: none;
  }
  .btn::after {
    content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.65), transparent);
    animation: shine 2.8s ease-in-out 3.2s infinite;
  }
  @keyframes shine { 0% { left: -60%; } 45%, 100% { left: 130%; } }
  .btn:active { transform: scale(0.98); }
  .btn .arrow { transition: transform .2s; }
  .btn:hover .arrow { transform: translateX(3px); }
  .note { font-size: 12px; line-height: 1.55; color: var(--muted); text-align: center; word-break: keep-all; }
  .foot { font-size: 12px; color: rgba(185, 194, 220, 0.7); text-align: center; animation-delay: 2.6s; }

  /* 넘어갈 때 효과: 빛이 퍼지며 화면 전환 */
  .warp {
    position: fixed; z-index: 10; left: 50%; top: 50%;
    width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
    background: radial-gradient(circle, #fff7df 0%, var(--gold) 45%, rgba(243,212,138,0) 70%);
    transform: scale(0); opacity: 0; pointer-events: none;
  }
  .warp.go { animation: warp 0.9s cubic-bezier(.6,0,.4,1) forwards; }
  @keyframes warp { 0% { transform: scale(0); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(160); opacity: 1; } }
  .wrap.leave { transition: opacity .4s, transform .6s; opacity: 0; transform: scale(0.96); }

  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; opacity: 1; transform: none; }
    .btn::after { animation: none; }
    .warp.go { animation: none; }
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<main class="wrap" id="wrap">
  <span class="badge rise">2026 하반기 · 산하기관 합동 청렴교육</span>

  <h1 class="title">
    <span class="l1 rise">함께 지키는 청렴,</span>
    <span class="l2 rise"><em>함께 만드는 신뢰</em></span>
  </h1>

  <p class="lead rise">오늘 교육에 참석해 주셔서 감사합니다.<br>출석 확인과 짧은 강사 평가에 참여해 주세요.</p>

  <dl class="card rise">
    <div class="row"><dt>일시</dt><dd>2026. 12. 8.(화) 10:00 ~ 12:00</dd></div>
    <div class="row"><dt>장소</dt><dd>안산문화예술의전당 별무리극장</dd></div>
    <div class="row"><dt>주제</dt><dd><span class="nw">청탁금지법 ·</span> <span class="nw">행동강령 ·</span> <span class="nw">이해충돌방지법</span></dd></div>
  </dl>

  <div class="steps rise">
    <div class="step"><span class="n">1</span><b>출석 확인</b>소속기관 · 직위 · 성명</div>
    <div class="step"><span class="n">2</span><b>강사 평가</b>4문항 · 약 1분</div>
  </div>

  <div class="cta rise">
    <a class="btn" id="go" href="#">출석 체크 시작하기 <span class="arrow">→</span></a>
    <p class="note">끝까지 제출하셔야 출석이 인정됩니다.<br>입력하신 정보는 출석 확인 목적으로만 사용됩니다.</p>
  </div>

  <p class="foot rise">안산문화재단 감사실</p>
</main>

<div class="warp" id="warp" aria-hidden="true"></div>

<script>
  // ▼ 네이버폼 주소를 여기에 붙여 넣으세요
  const FORM_URL = "https://naver.me/xfb7lOnV";

  // 별 하늘 (별무리극장 콘셉트)
  (function () {
    const c = document.getElementById('sky');
    const ctx = c.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W, H, stars = [], shooting = null, t0 = performance.now();
    function size() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = c.clientWidth; H = c.clientHeight;
      c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(W * H / 2600);
      stars = Array.from({ length: n }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.3 + 0.3,
        p: Math.random() * Math.PI * 2, s: Math.random() * 1.2 + 0.4,
        d: Math.random() * 1.2 // 등장 지연(초)
      }));
    }
    function draw(now) {
      const t = (now - t0) / 1000;
      ctx.clearRect(0, 0, W, H);
      for (const s of stars) {
        const fade = Math.min(1, Math.max(0, (t - s.d) / 1.2));
        const tw = reduce ? 0.8 : 0.55 + 0.45 * Math.sin(t * s.s + s.p);
        ctx.globalAlpha = fade * tw;
        ctx.fillStyle = s.r > 1.2 ? '#ffe9b8' : '#ffffff';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      if (!reduce) {
        if (!shooting && t > 2.5 && Math.random() < 0.006) {
          shooting = { x: Math.random() * W * 0.6 + W * 0.3, y: Math.random() * H * 0.3, l: 0 };
        }
        if (shooting) {
          shooting.l += 9;
          const k = shooting.l;
          const g = ctx.createLinearGradient(shooting.x - k, shooting.y + k * 0.5, shooting.x - k + 80, shooting.y + k * 0.5 - 40);
          g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,240,200,0.9)');
          ctx.globalAlpha = Math.max(0, 1 - k / 420);
          ctx.strokeStyle = g; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(shooting.x - k, shooting.y + k * 0.5);
          ctx.lineTo(shooting.x - k + 80, shooting.y + k * 0.5 - 40); ctx.stroke();
          if (k > 420) shooting = null;
        }
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }
    window.addEventListener('resize', size);
    size(); requestAnimationFrame(draw);
  })();

  // 버튼을 누르면 빛이 퍼지며 네이버폼으로 이동
  document.getElementById('go').addEventListener('click', function (e) {
    e.preventDefault();
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { location.href = FORM_URL; return; }
    document.getElementById('wrap').classList.add('leave');
    document.getElementById('warp').classList.add('go');
    setTimeout(function () { location.href = FORM_URL; }, 850);
  });
</script>
</body>
</html>
